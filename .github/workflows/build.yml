# Build a release binary (Windows).
# Triggers: version tags (v*) or manual workflow_dispatch.
name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create or update a GitHub Release for this run"
        required: false
        default: false
        type: boolean
      tag:
        description: "Tag name when creating a release (e.g. v0.1.0). Leave empty to use the run id."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build release
        run: cargo build --release

      - name: Resolve version label
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } elseif ("${{ inputs.tag }}" -ne "") {
            $version = "${{ inputs.tag }}"
          } else {
            $version = "build-${{ github.run_number }}"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=pideck-$version-windows-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$version"

      - name: Stage artifact
        shell: pwsh
        run: |
          $out = "dist/${{ steps.meta.outputs.artifact_name }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target/release/pi-gui.exe" "$out/pi-gui.exe"
          Copy-Item "LICENSE" "$out/LICENSE"
          Copy-Item "README.md" "$out/README.md"
          if (Test-Path "bridge") {
            Copy-Item -Recurse "bridge" "$out/bridge"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/${{ steps.meta.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Package zip for release
        if: github.ref_type == 'tag' || inputs.create_release
        shell: pwsh
        run: |
          $name = "${{ steps.meta.outputs.artifact_name }}"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist/${{ steps.meta.outputs.artifact_name }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
