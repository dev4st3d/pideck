# Build and publish a Velopack Windows installer/update feed using the
# package version in Cargo.toml. Run manually after bumping the version.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Resolve release version
        id: meta
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $rootManifest = (Get-Item "Cargo.toml").FullName
          $package = $metadata.packages |
            Where-Object { [System.IO.Path]::GetFullPath($_.manifest_path) -eq $rootManifest } |
            Select-Object -First 1

          if ($null -eq $package) {
            throw "Could not find the root package in cargo metadata."
          }

          $version = $package.version
          $tag = "v$version"
          $existingTag = git tag --list $tag
          if ($existingTag) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to $tagCommit. Bump package.version in Cargo.toml before publishing another release."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=pideck-$tag-windows-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Publishing $tag"

      - name: Build release
        run: cargo build --release

      - name: Install Velopack CLI
        run: dotnet tool update --global vpk --version 0.0.1298

      # Delta generation is optional. The first Velopack release, or a release
      # after a missing feed, still produces a complete full update package.
      - name: Download previous package
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl "https://github.com/dev4st3d/pideck" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --channel win `
            --outputDir "dist/releases"

      - name: Package installer and update feed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/app" | Out-Null
          Copy-Item "target/release/pi-gui.exe" "dist/app/pi-gui.exe"

          vpk pack `
            --packId "PiDeck" `
            --packVersion "${{ steps.meta.outputs.version }}" `
            --packDir "dist/app" `
            --mainExe "pi-gui.exe" `
            --packTitle "PiDeck" `
            --packAuthors "dev4st3d" `
            --icon "assets/app.ico" `
            --shortcuts "Desktop,StartMenuRoot" `
            --noPortable `
            --channel win `
            --outputDir "dist/releases"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/releases/PiDeck-win-Setup.exe
            dist/releases/PiDeck-${{ steps.meta.outputs.version }}-*.nupkg
            dist/releases/releases.win.json
            dist/releases/RELEASES
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PiDeck ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/releases/PiDeck-win-Setup.exe
            dist/releases/PiDeck-${{ steps.meta.outputs.version }}-*.nupkg
            dist/releases/releases.win.json
            dist/releases/RELEASES
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
