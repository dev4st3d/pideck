# Build and publish a Windows release using the package version in Cargo.toml.
# Run this workflow manually after bumping the package version.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Resolve release version
        id: meta
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $rootManifest = (Get-Item "Cargo.toml").FullName
          $package = $metadata.packages |
            Where-Object { [System.IO.Path]::GetFullPath($_.manifest_path) -eq $rootManifest } |
            Select-Object -First 1

          if ($null -eq $package) {
            throw "Could not find the root package in cargo metadata."
          }

          $version = $package.version
          $tag = "v$version"
          $existingTag = git tag --list $tag
          if ($existingTag) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to $tagCommit. Bump package.version in Cargo.toml before publishing another release."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=pideck-$tag-windows-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Publishing $tag"

      - name: Build release
        run: cargo build --release

      - name: Stage standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item `
            "target/release/pi-gui.exe" `
            "dist/${{ steps.meta.outputs.artifact_name }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/${{ steps.meta.outputs.artifact_name }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/${{ steps.meta.outputs.artifact_name }}.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
