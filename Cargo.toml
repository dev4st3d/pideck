[package]
name = "pi-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native desktop app built with Rust and GPUI"

[dependencies]
async-channel = "2.5.0"
base64 = "0.22.1"
gpui = "0.2.2"
image = "0.25.9"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# GPUI, layout, markdown, and image work are hot enough that an entirely
# unoptimized `cargo run` gives a misleadingly sluggish development build.
# Keep the application debuggable while compiling the renderer-facing path
# similarly to Zed's development profile.
[profile.dev]
opt-level = 1
debug = "limited"
incremental = true
codegen-units = 16

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package."pulldown-cmark"]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
