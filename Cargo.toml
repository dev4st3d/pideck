[package]
name = "pi-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native desktop app built with Rust and GPUI"

[dependencies]
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
strip = true

