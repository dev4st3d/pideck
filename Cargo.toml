[package]
name = "pi-gui"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "Pideck — a native multi-project terminal manager (GPUI)"
license = "MIT"
repository = "https://github.com/dev4st3d/pideck"
readme = "README.md"

[dependencies]
async-channel = "2.5.0"
alacritty_terminal = "0.26.0"
gpui = "0.2.2"
gpui-component = { version = "=0.5.1", default-features = false }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.2.0"
trash = "5.2.8"

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
velopack = "0.0.1298"
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# GPUI and terminal rendering are hot enough that an entirely
# unoptimized `cargo run` gives a misleadingly sluggish development build.
# Keep the application debuggable while compiling the renderer-facing path
# similarly to Zed's development profile.
[profile.dev]
opt-level = 1
debug = "limited"
incremental = true
codegen-units = 16

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
